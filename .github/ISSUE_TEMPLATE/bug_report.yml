name: Bug report
description: Something in the dex is broken or wrong.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please include enough detail to reproduce it.
  - type: input
    id: route
    attributes:
      label: Where did it happen?
      description: Page URL or route, e.g. /dex?type=ghost or /pokemon/94
      placeholder: /dex
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include console errors or a screenshot if you have them.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130, Windows 11
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I refreshed the page and tried again.
          required: true
        - label: This is not a data error coming straight from PokéAPI.
